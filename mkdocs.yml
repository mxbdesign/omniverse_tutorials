theme:
  name: material
  palette:
    - scheme: slate       # required: this activates the [data-md-color-scheme="slate"] tokens our CSS overrides
      primary: black
      accent: light green
  features:
    - navigation.instant  # optional but recommended — extra.js hooks document$ to support this
    - navigation.tracking
    - navigation.expand

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
