theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    logo: null          # ensures the default book icon doesn't fight with your custom logo
  palette:
    - scheme: slate
      primary: black
      accent: light green
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy      # ← this is what adds the copy button, no JS needed

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences     # required — copy button only renders on properly fenced code blocks

plugins:
  - search                   # if you already have a `plugins:` list elsewhere, just make sure `search` is in it

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
